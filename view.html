<!doctype html>
<!--
  Комната без редактора - только посмотреть. Её показывает виджет
  мини-игры в OBS, когда игрок в конце забега заходит к себе в комнату.
  Открытая напрямую, показывает комнату из ссылки: view.html#r=КОД
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Комната</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body.alone {
    background: radial-gradient(70% 70% at 40% 42%, #d9975a 0%, #a8653a 45%, #4a2a1f 100%);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<script type="module" src="js/view.js"></script>
</body>
</html>
